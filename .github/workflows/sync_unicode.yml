name: Sync Unicode Fonts

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout our repository
        uses: actions/checkout@v4
        with:
          path: GoogleSansMax

      - name: Checkout UnicodeFontSet repository
        uses: actions/checkout@v4
        with:
          repository: Losketch/UnicodeFontSet-magisk-module
          path: UnicodeFontSet

      - name: Sync Unicode files
        run: |
          echo "Syncing lib and font-source from UnicodeFontSet..."

          # Preserve our custom files that upstream sync would overwrite
          cp GoogleSansMax/lib/awk.sh /tmp/awk.sh.bak
          cp GoogleSansMax/lib/manifest.txt /tmp/manifest.txt.bak 2>/dev/null || true
          cp GoogleSansMax/customize.sh /tmp/customize.sh.bak
          cp GoogleSansMax/action.sh /tmp/action.sh.bak
          cp GoogleSansMax/service.sh /tmp/service.sh.bak
          cp GoogleSansMax/config/fonts_fragment.xml /tmp/fonts_fragment.xml.bak 2>/dev/null || true

          rm -rf GoogleSansMax/lib GoogleSansMax/font-source GoogleSansMax/config GoogleSansMax/lang GoogleSansMax/*.sh
          cp -r UnicodeFontSet/module/lib GoogleSansMax/lib
          cp -r UnicodeFontSet/font-source GoogleSansMax/font-source
          cp -r UnicodeFontSet/module/config GoogleSansMax/config
          cp -r UnicodeFontSet/module/lang GoogleSansMax/lang
          cp UnicodeFontSet/module/system/fonts/*.otf GoogleSansMax/system/fonts/

          # Restore our custom files
          cp /tmp/awk.sh.bak GoogleSansMax/lib/awk.sh
          cp /tmp/manifest.txt.bak GoogleSansMax/lib/manifest.txt 2>/dev/null || true
          cp /tmp/customize.sh.bak GoogleSansMax/customize.sh
          cp /tmp/action.sh.bak GoogleSansMax/action.sh
          cp /tmp/service.sh.bak GoogleSansMax/service.sh
          cp /tmp/fonts_fragment.xml.bak GoogleSansMax/config/fonts_fragment.xml 2>/dev/null || true

      - name: Ensure GPL license headers
        run: |
          echo "Reapplying GPL headers to synced files..."
          for f in GoogleSansMax/lib/*.sh GoogleSansMax/lang/*.sh; do
              [ -f "$f" ] && sh GoogleSansMax/scripts/apply-gpl-header.sh "$f"
          done

      - name: Update Blocks.txt
        run: |
          echo "Downloading latest Blocks.txt from unicode.org..."
          URL="https://unicode.org/Public/UCD/latest/ucd/Blocks.txt"
          FALLBACK="https://unicode.org/Public/18.0.0/ucd/Blocks.txt"
          OLD_VER=$(head -1 GoogleSansMax/webroot/Blocks.txt | grep -oP 'Blocks-\K[0-9]+\.[0-9]+\.[0-9]+' 2>/dev/null || echo "0.0.0")
          for SRC in "$URL" "$FALLBACK"; do
            curl -L --retry 3 -s "$SRC" -o /tmp/Blocks.new 2>/dev/null
            if [ -s /tmp/Blocks.new ] && head -1 /tmp/Blocks.new | grep -q 'Blocks-'; then
              NEW_VER=$(head -1 /tmp/Blocks.new | grep -oP 'Blocks-\K[0-9]+\.[0-9]+\.[0-9]+')
              echo "  Current: $OLD_VER  Downloaded: $NEW_VER  (from $SRC)"
              LOWER=$(printf '%s\n' "$NEW_VER" "$OLD_VER" | sort -V | head -1)
              if [ "$LOWER" = "$OLD_VER" ]; then
                cp /tmp/Blocks.new GoogleSansMax/webroot/Blocks.txt
                echo "  Blocks.txt updated to $NEW_VER"
                break
              else
                echo "  Skipping: $NEW_VER is older than current $OLD_VER"
              fi
            else
              echo "  Failed or invalid from $SRC"
            fi
          done

      - name: Commit and Push changes
        run: |
          cd GoogleSansMax
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ font-source/ config/ lang/ *.sh system/fonts/*.otf webroot/Blocks.txt

          if git diff --staged --quiet; then
            echo "No updates found. Everything is up to date."
          else
            git commit -m "Auto-sync: Update Unicode files and Blocks.txt"
            git push
            echo "Updates synced and pushed successfully!"
          fi
